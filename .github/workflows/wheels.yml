name: Wheels

# A version tag builds, tests, releases and publishes. Manual runs and pull requests that touch
# packaging build and test only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/wheels.yml
      - scripts/release/**
      - pyproject.toml
      - Cargo.toml
      - crates/*/Cargo.toml
      - Cargo.lock
      - python/**

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  MATURIN_VERSION: v1.15.0

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the tag to match the package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/release/check_version.py "$TAG"
      # Other runs exercise the guard's environment, so the first tag cannot fail on setup.
      - name: Check that the package version can be read
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: cargo metadata --no-deps --format-version 1 > /dev/null

  build:
    needs: version
    # Keep this platform list in step with the test job's.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
          - platform: macos-arm64
            runner: macos-15
            target: aarch64
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64
          - platform: windows-x64
            runner: windows-2025
            target: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Three wheels per platform: the stable ABI for GIL builds from 3.12, a version-specific
      # wheel for 3.14t, and the free-threaded stable ABI for 3.15t and later. 3.12 is set up
      # last so that it stays the default interpreter.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python314t
        with:
          python-version: "3.14t"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python315t
        with:
          python-version: "3.15t"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python312
        with:
          python-version: "3.12"
      # Linux wheels build in a manylinux container, where before-script-linux sets the flags.
      - name: Remap build-machine paths
        if: runner.os != 'Linux'
        run: echo "RUSTFLAGS=$(scripts/release/remap-rustflags.sh)" >> "$GITHUB_ENV"
      - name: Build the GIL stable-ABI wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: auto
          args: >-
            --release --locked --out dist
            --interpreter "${{ runner.os == 'Linux' && 'python3.12' || steps.python312.outputs.python-path }}"
          before-script-linux: export RUSTFLAGS="$(scripts/release/remap-rustflags.sh)"
      - name: Build the Python 3.14t wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: auto
          args: >-
            --release --locked --out dist
            --interpreter "${{ runner.os == 'Linux' && 'python3.14t' || steps.python314t.outputs.python-path }}"
          before-script-linux: export RUSTFLAGS="$(scripts/release/remap-rustflags.sh)"
      - name: Build the free-threaded stable-ABI wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: auto
          args: >-
            --release --locked --out dist
            --interpreter "${{ runner.os == 'Linux' && 'python3.15t' || steps.python315t.outputs.python-path }}"
          before-script-linux: export RUSTFLAGS="$(scripts/release/remap-rustflags.sh)"
      - name: Check that no build-machine path is embedded
        run: scripts/release/check-wheel-paths.sh dist/*.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Each wheel is installed into a clean environment on its own platform and tested there with
  # the interpreters it serves.
  test:
    needs: build
    # Keep this platform list in step with the build job's.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-${{ matrix.platform }}
          path: dist
      - name: Test the GIL wheel with Python 3.12
        run: scripts/release/test-wheel.sh dist/*-cp312-abi3-*.whl 3.12
      - name: Test the GIL wheel with Python 3.14
        run: scripts/release/test-wheel.sh dist/*-cp312-abi3-*.whl 3.14
      - name: Test the GIL wheel with Python 3.15
        run: scripts/release/test-wheel.sh dist/*-cp312-abi3-*.whl 3.15
      - name: Test the Python 3.14t wheel
        run: scripts/release/test-wheel.sh dist/*-cp314-cp314t-*.whl 3.14t
      - name: Test the free-threaded stable-ABI wheel with Python 3.15t
        run: scripts/release/test-wheel.sh dist/*-cp315-abi3.abi3t-*.whl 3.15t
      - name: Test the free-threaded stable-ABI wheel with GIL Python 3.15
        run: scripts/release/test-wheel.sh dist/*-cp315-abi3.abi3t-*.whl 3.15

  # The sdist is installed from the archive itself, away from the source tree, and tested the
  # same way as the wheels.
  sdist-test:
    needs: sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist
      - name: Build, install and test the sdist with Python 3.12
        run: scripts/release/test-wheel.sh dist/*.tar.gz 3.12

  sizes:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Check wheel sizes against the budget
        run: python3 scripts/release/check_wheel_sizes.py dist/*.whl

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, sdist, sdist-test, test, sizes]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload its files
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist
      - name: Create the GitHub release with every wheel and the sdist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/umber
    permissions:
      id-token: write # trusted publishing: exchange an OIDC token with PyPI
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
