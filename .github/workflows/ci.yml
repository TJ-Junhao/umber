name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p umber-core
      - run: cargo test --doc -p umber-core

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-about@0.9.2 --features cli
      - run: scripts/licenses/generate.sh
      - run: git diff --exit-code THIRD-PARTY-LICENSES.txt

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.88 --profile minimal
      - run: cargo +1.88 check -p umber-core --locked

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - run: uv run maturin develop --uv
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run mypy
      - run: uv run python -m mypy.stubtest umber._umber
      - run: uv run pytest -q
      - name: Build release dists without local paths
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: scripts/release/build-dists.sh

  ci-ok:
    if: always()
    needs: [rust, licenses, msrv, python]
    runs-on: ubuntu-latest
    steps:
      - name: Require every needed job to have succeeded
        run: |
          echo "rust=${{ needs.rust.result }} licenses=${{ needs.licenses.result }} msrv=${{ needs.msrv.result }} python=${{ needs.python.result }}"
          test "${{ needs.licenses.result }}" = "success"
          test "${{ needs.msrv.result }}" = "success"
          test "${{ needs.rust.result }}" = "success"
          test "${{ needs.python.result }}" = "success"
