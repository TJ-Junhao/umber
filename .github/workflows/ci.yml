name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Git revision to compare this ref's refactor output against
        required: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p umber-core
      - run: cargo test -p umber-core --example refactor_outputs --locked
      - run: scripts/test-check-refactor-output.sh
      - run: scripts/check-refactor-output.sh check
      # The packaged crate must compile and pass its own unit tests with only the files it ships.
      - name: Test the packaged crate
        run: |
          # The cache may hold the package of an earlier version; keep only this one.
          rm -rf target/package
          cargo package -p umber-core --allow-dirty --no-verify
          # --no-verify leaves only the .crate archive, so unpack it before testing.
          tar -xzf target/package/umber-core-*.crate -C target/package
          cd target/package/umber-core-*/
          cargo test --lib

  # Same-machine, byte-exact comparison including PNG output. Refactor pull requests carry the
  # label `refactor`; pull requests without it skip this job, and ci-ok accepts a skipped job.
  refactor-compare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'refactor'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - name: Compare outputs with the base revision, PNG included
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
        run: scripts/check-refactor-output.sh compare "$BASE" --png

  # Every existing output must stay unchanged except the cases listed in intended-changes.txt.
  # The check reads two committed manifests and builds nothing, so it does not need the label.
  output-extend:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compare the committed manifest with the base revision's
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: scripts/check-refactor-output.sh extend "$BASE"

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-about@0.9.2 --features cli
      - run: scripts/licenses/generate.sh
      - run: git diff --exit-code THIRD-PARTY-LICENSES.txt

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.88 --profile minimal
      - run: cargo +1.88 check -p umber-core --locked

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # No forced-lazy full-suite job yet: pytest, NumPy/pandas and polars break under it.
        # Add it when they support Python 3.15 lazy imports; the subprocess test runs here.
        python: ["3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - run: uv run maturin develop --uv
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run mypy
      - run: uv run python -m mypy.stubtest umber._umber
      - run: uv run pytest -q
      # The binding's unit tests embed this job's interpreter and import the package built above.
      # The test binary links the interpreter's shared library, so the loader must find this
      # interpreter's copy first: LD_LIBRARY_PATH on Linux, PATH on Windows.
      - name: Test the binding crate
        shell: bash
        run: |
          libdir="$(uv run python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR") or "")')"
          base="$(uv run python -c 'import sys; print(sys.base_prefix)')"
          if [[ "$RUNNER_OS" == "Windows" ]]; then base="$(cygpath -u "$base")"; fi
          export LD_LIBRARY_PATH="$libdir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export PATH="$base:$PATH"
          uv run cargo test -p umber-py --locked
      - name: Build release dists without local paths
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: scripts/release/build-dists.sh

  # Free-threaded CPython: cp314t on 3.14t, abi3t on 3.15t. polars-runtime-32 has only
  # abi3 wheels, so polars and its two test modules are excluded on both interpreters.
  # psutil has no 3.15t wheels: exclude it, IPython (which requires it), and test_jupyter.py
  # on 3.15t only. --no-sync and --skip-install keep later steps from reinstalling them.
  python-free-threaded:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.14t", "3.15t"]
        include:
          - python: "3.15t"
            skip-packages: --no-install-package ipython --no-install-package psutil
            skip-tests: --ignore=tests/python/test_jupyter.py
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev --no-install-package polars --no-install-package polars-runtime-32 ${{ matrix.skip-packages }}
      # uv sync installed umber as an editable package; this builds its extension in place.
      - run: uv run --no-sync maturin develop --skip-install
      - run: uv run --no-sync python -m mypy.stubtest umber._umber
      - run: uv run --no-sync pytest -q --ignore=tests/python/test_values.py --ignore=tests/python/test_time_polars.py ${{ matrix.skip-tests }}
      # As in the python job: the test binary must load this interpreter's shared library.
      - name: Test the binding crate
        shell: bash
        run: |
          libdir="$(uv run --no-sync python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR") or "")')"
          base="$(uv run --no-sync python -c 'import sys; print(sys.base_prefix)')"
          if [[ "$RUNNER_OS" == "Windows" ]]; then base="$(cygpath -u "$base")"; fi
          export LD_LIBRARY_PATH="$libdir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export PATH="$base:$PATH"
          uv run --no-sync cargo test -p umber-py --locked

  ci-ok:
    if: always()
    needs: [rust, licenses, msrv, python, python-free-threaded, refactor-compare, output-extend]
    runs-on: ubuntu-latest
    steps:
      - name: Require every needed job to have succeeded
        run: |
          echo "rust=${{ needs.rust.result }} licenses=${{ needs.licenses.result }} msrv=${{ needs.msrv.result }} python=${{ needs.python.result }} python-free-threaded=${{ needs.python-free-threaded.result }} refactor-compare=${{ needs.refactor-compare.result }} output-extend=${{ needs.output-extend.result }}"
          test "${{ needs.licenses.result }}" = "success"
          test "${{ needs.msrv.result }}" = "success"
          test "${{ needs.rust.result }}" = "success"
          test "${{ needs.python.result }}" = "success"
          test "${{ needs.python-free-threaded.result }}" = "success"
          # Skipped when the pull request has no `refactor` label.
          test "${{ needs.refactor-compare.result }}" = "success" || test "${{ needs.refactor-compare.result }}" = "skipped"
          # Runs on pull requests only.
          test "${{ needs.output-extend.result }}" = "success" || test "${{ needs.output-extend.result }}" = "skipped"
