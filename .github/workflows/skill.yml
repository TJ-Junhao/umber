name: Skill

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: skill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - run: uv run maturin develop --uv
      - name: Check generated reference and repository copy
        run: uv run python scripts/gen_skill.py --check
      - name: Test installation, API coverage, examples and version
        run: uv run pytest -q tests/python/test_skill_cli.py tests/python/test_skill_content.py
      - name: Check packaged skill files
        run: |
          uv run maturin build --release --out dist
          uv run python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          source = Path("python/umber/_skill/umber")
          expected = {path.relative_to(Path("python")).as_posix(): path.read_bytes()
                      for path in source.rglob("*") if path.is_file()}
          assert "umber/_skill/umber/SKILL.md" in expected
          assert "umber/_skill/umber/references/api.md" in expected
          for wheel in Path("dist").glob("*.whl"):
              with ZipFile(wheel) as archive:
                  for name, content in expected.items():
                      assert archive.read(name) == content, name
                      print(f"{wheel.name}: {name}")
          PY
