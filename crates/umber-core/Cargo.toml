[package]
name = "umber-core"
description = "Rendering core of umber, a plotting library written in Rust."
keywords = ["plotting", "charts", "visualization", "svg", "png"]
categories = ["visualization", "graphics", "rendering"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
include = [
    "src/**/*",
    "fonts/**/*",
    "tests/fixtures/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[dependencies]
fontdb = "0.24.0"
harfrust = "0.14.0"
png = "0.18.1"
read-fonts = "0.45.0"
skrifa = "0.48.0"
thiserror.workspace = true
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }

[dev-dependencies]
insta = "1.49.0"
proptest = "1.11"
roxmltree = "0.20"

[lints]
workspace = true
