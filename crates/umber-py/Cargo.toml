[package]
name = "umber-py"
description = "PyO3 bindings for umber (internal, not published)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "_umber"
crate-type = ["cdylib"]

[dependencies]
umber-core = { path = "../umber-core" }
# The workspace enables both stable ABIs: a 3.12 interpreter builds abi3, and a 3.15+
# interpreter builds abi3t. Free-threaded CPython 3.14t needs a version-specific cp314t
# extension; PyO3 and maturin select it from the same features.
pyo3.workspace = true

[lints]
workspace = true
