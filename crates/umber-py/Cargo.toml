[package]
name = "umber-py"
description = "PyO3 bindings for umber (internal, not published)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "_umber"
crate-type = ["cdylib"]

[dependencies]
umber-core = { path = "../umber-core" }
# The workspace enables `abi3-py312`, which applies to GIL builds only: the stable ABI does not
# cover free-threaded CPython 3.14t, so PyO3 and maturin build a version-specific `cp314t`
# extension for it from the same code.
pyo3.workspace = true

[lints]
workspace = true
