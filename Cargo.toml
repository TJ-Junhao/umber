[workspace]
resolver = "3"
members = ["crates/umber-core", "crates/umber-py"]

[workspace.package]
version = "0.3.2"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TJ-Junhao/umber"
homepage = "https://github.com/TJ-Junhao/umber"

[workspace.dependencies]
thiserror = "2.0.21"
pyo3 = { version = "0.29.3", features = ["abi3-py312", "abi3t-py315"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
